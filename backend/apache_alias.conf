# วิธีที่ 1: Alias — เพิ่มใน httpd.conf (หรือ extra/httpd-vhosts.conf ของ XAMPP)
# เข้า http://<SERVER_IP>/smart_farm/api/... แล้วดึงไฟล์จากไดรฟ์ D:
Alias /smart_farm "D:/Project/Smart-Agriculture-QA/backend"

<Directory "D:/Project/Smart-Agriculture-QA/backend">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# วิธีที่ 2: เปลี่ยน DocumentRoot ทั้งหมด (เลือกอย่างใดอย่างหนึ่ง)
# DocumentRoot "D:/MyWebSite/public_html"
# <Directory "D:/MyWebSite/public_html">
#     Options Indexes FollowSymLinks
#     AllowOverride All
#     Require all granted
# </Directory>
#
# หลังแก้ไข: restart Apache
